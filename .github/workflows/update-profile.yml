name: Update Profile Workshop

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    branches: [main]
    paths: ["src/**", "scripts/**", "tests/**", "README.template.md", "package*.json", ".github/workflows/**", "assets/previews/**", "docs/**"]

concurrency:
  group: profile-workshop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install verified cloc 2.10
        run: |
          curl --fail --location --silent --show-error https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.pl --output "$RUNNER_TEMP/cloc-2.10.pl"
          echo "bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83  $RUNNER_TEMP/cloc-2.10.pl" | sha256sum --check
      - name: Measure selected public original repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOC_SCRIPT: ${{ runner.temp }}/cloc-2.10.pl
          PROFILE_SOURCE_CACHE: ${{ runner.temp }}/profile-source-cache
        run: npm run collect
      - name: Public GitHub stats — light
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=jeongiryang&show_icons=true&hide_rank=true&hide_border=true&theme=default&disable_animations=true
          path: assets/generated/github-stats-light.svg
          token: ${{ github.token }}
          core_version: "2.2.1"
          fail_on_error: true
      - name: Public GitHub stats — dark
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=jeongiryang&show_icons=true&hide_rank=true&hide_border=true&theme=tokyonight&disable_animations=true
          path: assets/generated/github-stats-dark.svg
          token: ${{ github.token }}
          core_version: "2.2.1"
          fail_on_error: true
      - name: Visualize the actual contribution calendar
        continue-on-error: true
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: jeongiryang
          outputs: |
            assets/generated/contribution-snake-light.svg
            assets/generated/contribution-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - name: Build and verify the complete public profile
        run: npm run check
      - name: Commit only meaningful generated changes
        run: |
          git add README.md assets/generated
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: 프로필 통계와 작품실 생성물 갱신"
            git push
          fi
      - name: Upload HTML portfolio
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: update-profile
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the workshop
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
